<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCA Visual Practice</title>
<link rel="stylesheet" href="style.css">
<script src="paper.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<header><div><strong>MCA Visual Practice</strong><span>Offline mock paper · 35 questions</span></div><div id="counter"></div></header>
<div class="layout">
<aside><h2>Questions</h2><p id="summary"></p><nav id="question-nav" aria-label="Questions"></nav><p class="aside-note">Answers and progress stay in this browser on this computer.</p></aside>
<main><div class="eyebrow" id="meta"></div><h1 id="title"></h1><p id="context" class="context" hidden></p><p id="prompt"></p>
<section id="visual" hidden><div class="visual-toolbar"><span>Source figure</span><div><button id="zoom-out" title="Zoom out">−</button><span id="zoom-label">100%</span><button id="zoom-in" title="Zoom in">+</button><button id="zoom-reset">Reset</button></div></div><div id="figure-viewport"><div id="figure-layer"><img id="figure" alt="Question figure"><div id="answer-targets"></div><div id="placed-tokens"></div></div></div></section>
<div id="interaction"></div><div class="actions"><button id="prev">← Previous</button><button id="check" class="primary">Check answer</button><button id="next">Next →</button></div><div id="feedback" aria-live="polite"></div>
</main></div>
</body></html>
